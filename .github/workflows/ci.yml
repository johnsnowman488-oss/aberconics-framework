name: Python + C++ CI
# Retried after deferring Julia checks; this workflow currently validates C++ and Python only.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GFE_CORE_LIB: ${{ github.workspace }}/code/c++ core/build-shared/libgfe_core.so
      PYTHONPATH: ${{ github.workspace }}/code/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build shared C++ core
        run: |
          cmake -S "code/c++ core" -B "code/c++ core/build-shared" -DBUILD_SHARED_LIBS=ON
          cmake --build "code/c++ core/build-shared" -j

      - name: Run C++ tests
        run: ctest --test-dir "code/c++ core/build-shared" --output-on-failure

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest matplotlib
          pytest -q code/python/tests

