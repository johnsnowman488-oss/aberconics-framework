name: Python + C++ CI
# Retried after deferring Julia checks; this workflow currently validates C++ and Python only.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  cpp-tests:
    name: C++ core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 + MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure + Build (static, Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S "code/c++ core" -B "code/c++ core/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "code/c++ core/build" -j

      - name: Configure + Build (static, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S "code/c++ core" -B "code/c++ core/build" \
            -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          cmake --build "code/c++ core/build" -j

      - name: Run C++ tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir "code/c++ core/build" --output-on-failure

      - name: Run C++ tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir "code/c++ core/build" --output-on-failure

  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: cpp-tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MSYS2 + MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build shared library (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S "code/c++ core" -B "code/c++ core/build-shared" \
            -DBUILD_SHARED_LIBS=ON -DGFE_BUILD_TESTS=OFF -DGFE_BUILD_APPS=OFF
          cmake --build "code/c++ core/build-shared" -j

      - name: Build shared library (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S "code/c++ core" -B "code/c++ core/build-shared" \
            -DBUILD_SHARED_LIBS=ON -DGFE_BUILD_TESTS=OFF -DGFE_BUILD_APPS=OFF \
            -G Ninja -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          cmake --build "code/c++ core/build-shared" -j

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        env:
          PYTHONPATH: code/python
        run: pytest -q code/python/tests

      - name: Validate Python modules and Lab browser script
        if: runner.os == 'Linux'
        run: |
          python -m compileall -q code/python/d2c/experiments/babi_g1l.py code/python/d2c/experiments/babi_g2.py code/python/d2c/experiments/confidence_metrics.py code/python/d2c/experiment_lab/server.py
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("code/python/d2c/experiment_lab/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one inline Lab script, found {len(scripts)}")
          Path("/tmp/experiment-lab.js").write_text(scripts[0])
          PY
          node --check /tmp/experiment-lab.js
