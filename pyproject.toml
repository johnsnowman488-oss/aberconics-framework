[project]
name = "aberconics-framework"
version = "0.1.0"
description = "Physics-grounded memory-kernel tooling and runtime infrastructure"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["code/python/tests"]
markers = [
    "smoke: fast smoke tests for wrapper call paths",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]